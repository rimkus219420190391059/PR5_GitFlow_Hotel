name: Feature request
description: Новая функциональность АИС «Гостиничный комплекс»
title: "[FEATURE] "
labels:
  - enhancement
body:
  - type: textarea
    id: goal
    attributes:
      label: Цель задачи
      description: Какую проблему решает функциональность?
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Требования
      description: Перечислите функциональные и технические требования.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Критерии приёмки
      description: По каким условиям задача считается выполненной?
    validations:
      required: true
